<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Flow</title>
    <script>
      // Set the theme before first paint so there is no dark/light flash.
      // Keep in step with src/lib/theme.ts.
      try {
        var pref =
          (JSON.parse(localStorage.getItem('promptflow:settings')) || {}).state
            ?.theme || 'system'
        var light =
          pref === 'light' ||
          (pref === 'system' &&
            window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#161310" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
